<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>파도 레이스 — 해파 속도 예측 게임</title>
  <meta name="description" content="심해파·천해파의 속도를 파도 경주에 베팅하며 익히는 고등학교 지구과학 복습 게임">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌊%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <button type="button" class="icon-btn" id="btnHome" aria-label="처음 화면으로">🏠</button>
    <div class="topbar-title">
      <span id="tbWorld" class="tb-world"></span>
      <strong id="tbRace" class="tb-race"></strong>
    </div>
    <div class="points" aria-live="polite">
      <span class="points-label">예측 포인트</span>
      <b id="tbPoints" class="num">0</b>
    </div>
    <button type="button" class="icon-btn" id="btnCodex" aria-label="도감 열기">📖</button>
    <button type="button" class="icon-btn" id="btnTheme" aria-label="다크 모드 전환">🌙</button>
  </header>

  <main id="app" class="app"></main>

  <section id="casterBar" class="caster-bar" hidden>
    <div class="otter" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="72" height="72" class="otter-face">
        <ellipse cx="50" cy="56" rx="38" ry="34" fill="#8A5A34"/>
        <ellipse cx="50" cy="62" rx="26" ry="22" fill="#C99A67"/>
        <circle cx="20" cy="30" r="10" fill="#8A5A34"/>
        <circle cx="80" cy="30" r="10" fill="#8A5A34"/>
        <circle cx="20" cy="30" r="5" fill="#C99A67"/>
        <circle cx="80" cy="30" r="5" fill="#C99A67"/>
        <g class="otter-eyes">
          <circle cx="37" cy="50" r="4.5" fill="#1F2A33"/>
          <circle cx="63" cy="50" r="4.5" fill="#1F2A33"/>
          <circle cx="38.5" cy="48.5" r="1.5" fill="#fff"/>
          <circle cx="64.5" cy="48.5" r="1.5" fill="#fff"/>
        </g>
        <ellipse cx="50" cy="62" rx="7" ry="5" fill="#1F2A33"/>
        <path d="M43 70 Q50 76 57 70" stroke="#1F2A33" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M30 66 H42 M58 66 H70" stroke="#5B3E22" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="26" y="8" width="48" height="10" rx="5" fill="#FF6B5A"/>
        <text x="50" y="16" text-anchor="middle" font-size="8" fill="#fff" font-family="Jua, sans-serif">ON AIR</text>
      </svg>
      <span class="otter-name">해달 캐스터</span>
    </div>
    <div class="bubble" role="status" aria-live="polite">
      <p id="bubbleText"></p>
    </div>
    <div class="actions" id="actions"></div>
  </section>

  <footer class="site-footer">© 2026 제작: 김연경(earthssaem@gmail.com)</footer>

  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <script src="js/physics.js"></script>
  <script src="js/races.js"></script>
  <script src="js/otter.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/raceview.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
